forecast:
  quantiles:
  - 0.5
  - 0.8
  - 0.9
  - 0.95
  horizon_days: 2
  min_lag_days: 2
  lags:
  - 2
  - 7
  - 14
  - 21
  - 28
  baseline_lag_days: 7
  rolling_windows:
  - 7
  - 28
  price_change_weeks: 4
  baseline_z:
    q80: 0.84
    q90: 1.28
    q95: 1.645
  drop_dates:
  - 12-25
  closed_dates:
  - 12-25
  event_distance_cap_days: 30
  long_zero_run_days: 90
  drop_long_zero_runs: false
  dead_item_q50: true
  slow_seller_max_avg_units: 5.0
  val_folds:
  - name: fold1_festive
    train_end: '2014-10-31'
    val_start: '2014-11-01'
    val_end: '2014-12-31'
    peak_days:
    - '2014-11-26'
    - '2014-12-23'
    - '2014-12-24'
  - name: fold2_main
    train_end: '2015-06-30'
    val_start: '2015-07-01'
    val_end: '2015-10-31'
  calibration_tolerance_pts: 3
  seed: 1
  keep_seeds:
  - 1
  - 2
  - 3
  params:
    learning_rate: 0.1
    max_iter: 300
    max_leaf_nodes: 31
    min_samples_leaf: 50
  line_params:
    q80:
      learning_rate: 0.05
      max_leaf_nodes: 63
      max_iter: 150
    q90:
      learning_rate: 0.05
      max_leaf_nodes: 31
      max_iter: 600
    q95:
      learning_rate: 0.05
      max_leaf_nodes: 63
      max_iter: 450
  tuning_grid:
    learning_rate:
    - 0.05
    - 0.1
    max_leaf_nodes:
    - 31
    - 63
    max_iter:
    - 600
  review:
    worst_n: 20
    shuffle_repeats: 3
    leak_fold: fold2_main
    leak_mae_floor: 3.6
  freeze_platform: Windows
  model_dir: outputs/forecast/model
  scores_dir: outputs/forecast/scores
  calendar_file: data/m5/calendar.csv
  service_lines:
    perishable: q95
    top_n_staples:
      n: 30
      line: q95
    slow_movers:
      below_avg_daily_units: 5
      line: q80
    default: q90
  layers:
    p7_empty_shelf: false
    random_product_sets: false
    multi_day_totals: false
    demand_multiplier: false
order_model:
  horizon_days: 7
  integer_days: 1
  lead_time_store_days: 1
  lead_time_supplier_days: 5
  solver:
    time_limit_s: 60
    mip_gap: 0.01
    feasibility_tolerance: 0.0001
    log: false
    warm_start: verified_plan
    decompose_by_dc: true
    parallel_time_reserve_s: 5
    start_plan_fallback: true
    replenishment_start: true
  case_size_bands:
  - - 6
    - 6
  - - 15
    - 12
  - - 30
    - 24
  - - .inf
    - 48
  cases_per_pallet: 20
  store_min_order_cases: 1
  dc_min_order_pallets: 1
  shelf_days: 10
  shelf_days_perishable: 4
  shelf_min_cases: 2
  overflow_penalty_share: 0.5
  backroom_capacity_units: null
  truck_capacity_cases: 400
  truck_trip_cost: 40
  buy_cost_share_of_price: 0.85
  holding_rate_per_year: 0.25
  holding_days_per_year: 365
  order_line_cost: 0.5
  service_shortfall_penalty_share: 0.5
  lost_sale_penalty_share: 1.5
  waste_disposal_share: 0.05
  budget_factor: 1.25
  terminal_store_days: 1
  terminal_dc_days: 5
  service_levels:
    perishable: 0.95
    top_n_staples:
      n: 30
      level: 0.95
    slow_movers:
      below_avg_daily_units: 5
      level: 0.8
    default: 0.9
  calibration:
    average_window_days: 28
    price_window_days: 28
    observation_lag_days: 7
    price_aggregation: median_active_store_days
    missing_sales_policy: zero
    freeze_at: test_start
  calendar:
    closed_store_month_days:
    - 12-25
    closed_dc_month_days: []
  initialization:
    integral_clip_rounding: floor
  presentation_stock: false
  days_of_supply_cap: false
  order_calendar: false
  receiving_capacity: false
  fair_share: false
  age_tracking: false
  supply_scenarios: false
  fulfillment_policy: earlier_service_priority
  early_service_margin_share: 0.01
  postsolve_objective_tolerance: 0.01
  warehouse_reserve_policy: daily_inventory_position
  dc_position_penalty_share: 0.5
  terminal_dc_penalty_cost_multiplier: 1.1
replay:
  methods:
  - last_week
  - topup_avg
  - topup_forecast
  - store_model
  - store_ilp
  warehouse: false
  unlimited_warehouse_units: 1000000
  forecast_days: 2
  weeks: 8
  input_dir: data/processed
  history_sales_file: data/processed/sales.parquet
  history_days: 35
  missing_history_units: 0
  exclude_closed_days_from_history: true
  output_dir: outputs/notebooks
  test_runs_log: outputs/notebooks/test_runs.log
  independent_audit: true
  store_review_days: 1
  warehouse_review_days: 1
  rounding: up
  last_week_lag_days: 7
  average_window_days: 28
  sigma_ddof: 1
  service_line_by_level:
  - - 0.5
    - q50
  - - 0.8
    - q80
  - - 0.9
    - q90
  - - 0.95
    - q95
  z_by_line:
    q50: 0.0
    q80: 0.8416
    q90: 1.2816
    q95: 1.6449
  shortage_split: proportional_largest_remainder
  budget_rule: scale_down_largest_remainder
  days_per_year: 365
analysis:
  store_ilp:
    space_factor: 1.0
    budget_factor: 1.25
    time_limit_s: 10
    mip_gap: 0.0001
    layers:
      service_floor:
        enabled: true
        share: 0.9
        gap_penalty_factor: 10
      spoilage_cap_in_ilp: true
      stock_value_cap:
        enabled: false
        cover_days: 3
  whatif:
    method: store_ilp
    runs:
    - param: order_model.truck_capacity_cases
      values:
      - 400
      - 100
      - 60
    - param: analysis.store_ilp.space_factor
      values:
      - 1.0
      - 0.5
      - 0.3
    - param: analysis.store_ilp.budget_factor
      values:
      - 1.25
      - 0.6
      - 0.45
    - param: order_model.lost_sale_penalty_share
      values:
      - 1.5
      - 1.0
      - 2.0
